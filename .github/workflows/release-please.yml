name: Release Please and notarized macOS release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  notarize-macos:
    name: Build, notarize, and upload macOS applications
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-14
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MAGENTART_DEVELOPER_ID: "Developer ID Application: Fabian Schmieder (898G35U5LW)"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install build requirements
        run: |
          brew install cmake
          xcodebuild -downloadComponent MetalToolchain

      - name: Configure release build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCODESIGN_IDENTITY="$MAGENTART_DEVELOPER_ID"

      - name: Build and notarize distributable applications
        run: |
          set -euo pipefail
          for target in notarize_mrt2_standalone notarize_mrt2_au notarize_mrt2_jam notarize_mrt2_collider; do
            bash examples/scripts/with-signing-keychain.sh \
              cmake --build build --target "$target" --parallel "$(sysctl -n hw.ncpu)"
          done

      - name: Upload notarized release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            build/MRT2_Standalone.zip \
            build/MRT2_AU.zip \
            build/MRT2_Jam.zip \
            build/MRT2_Collider.zip \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: notarized-macos-${{ needs.release-please.outputs.tag_name }}
          path: |
            build/MRT2_Standalone.zip
            build/MRT2_AU.zip
            build/MRT2_Jam.zip
            build/MRT2_Collider.zip
          if-no-files-found: error

  publish-pypi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/pypi_publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
