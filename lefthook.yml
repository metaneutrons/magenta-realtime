# Lefthook replaces husky, lint-staged, and commitlint in this repository.
commit-msg:
  commands:
    conventional-commits:
      run: sh scripts/hooks/check-commit-message.sh {1}

pre-commit:
  parallel: true
  commands:
    staged-guards:
      run: sh scripts/hooks/check-staged.sh
    secrets:
      run: gitleaks git --pre-commit --redact --staged --verbose
    eslint:
      glob: "examples/mrt2/react_ui/**/*.{ts,tsx,mts,cts}"
      run: bash scripts/hooks/lint-staged-typescript.sh {staged_files}
      stage_fixed: true
    lockfile:
      glob: "examples/**/package.json"
      run: |
        if ! git diff --cached --name-only | grep -qx 'examples/pnpm-lock.yaml'; then
          echo 'A workspace package.json changed without examples/pnpm-lock.yaml. Run pnpm install.' >&2
          exit 1
        fi

pre-push:
  parallel: false
  commands:
    secrets:
      run: sh scripts/hooks/check-push-secrets.sh
    typecheck:
      run: pnpm --dir examples run typecheck
    tests:
      run: pnpm --dir examples run test
